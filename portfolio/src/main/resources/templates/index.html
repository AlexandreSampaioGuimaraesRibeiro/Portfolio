<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${nome} + ' | Portfólio'">Portfólio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<div class="container">

    <header class="topo">
        <a class="marca" th:href="@{/}">
            <span class="avatar" th:text="${iniciais}">AR</span>
            <span>
                <strong th:text="${nome}">Alexandre Ribeiro</strong>
                <small th:text="${cargo}">Desenvolvedor Web</small>
            </span>
        </a>
        <nav class="menu" aria-label="Principal">
            <a th:href="@{/}" class="ativo" aria-current="page">Início</a>
            <a th:href="@{/sobre}">Sobre</a>
            <a th:href="@{/projetos}">Projetos</a>
            <a th:href="@{/habilidades}">Habilidades</a>
            <a th:href="@{/contato}">Contato</a>
        </nav>
    </header>

    <main class="hero">
        <section>
            <p class="status" th:text="${status}">Status</p>
            <p class="saudacao" th:text="'> Olá, eu sou ' + ${primeiroNome} + '.'">> Olá</p>
            <h1>
                <span th:text="${tituloInicio}">Título</span>
                <em th:text="${tituloDestaque}">destaque</em>
                <span th:text="${tituloFim}">fim</span>
            </h1>
            <p class="descricao" th:text="${descricao}">Descrição</p>

            <div class="botoes">
                <a class="btn primario" th:href="@{/projetos}">Ver meus projetos</a>
                <a class="btn" th:href="@{/contato}">Vamos conversar</a>
            </div>

            <div class="info">
                <span th:text="${local}">Local</span>
                <span th:text="${experiencia}">Experiência</span>
            </div>
        </section>

        <aside class="cartao">
            <span class="arquivo">foto_perfil.jpg</span>
            <span class="bola"></span>
            <img th:src="@{/img/foto.jpg}" alt="Foto de perfil">
                
            
            
            <div class="agora">
                <small>construindo agora</small>
                <strong th:text="${construindo}">Projeto atual</strong>
            </div>
        </aside>
    </main>

    <footer class="rodape">
        <span th:text="'© ' + ${ano} + ' ' + ${nome}">© Seu Nome</span>
        <span th:text="${lema}">Lema</span>
    </footer>

</div>
</body>
</html>
